<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized house with heart, warm orange palette -->
  <defs>
    <linearGradient id="g1o" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFF0E6"/>
      <stop offset="100%" stop-color="#FFE0C2"/>
    </linearGradient>
    <linearGradient id="g2o" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFD9B3"/>
      <stop offset="100%" stop-color="#FFB78A"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="24" fill="url(#g1o)" />

  <!-- Roof -->
  <polygon points="40,130 160,40 280,130" fill="#C26A00" opacity="0.95" />

  <!-- House body -->
  <rect x="80" y="130" width="160" height="110" rx="12" fill="url(#g2o)" stroke="#D88A3A" stroke-width="3"/>

  <!-- Door -->
  <rect x="150" y="170" width="40" height="70" rx="6" fill="#B96700"/>

  <!-- Heart on house (warm touch) -->
  <path d="M180 150
           c0 -10 14 -20 26 -8
           c12 -12 26 -2 26 8
           c0 18 -26 34 -52 54
           c-26 -20 -52 -36 -52 -54
           c0 -10 14 -20 26 -8
           z" fill="#FF6F4D" opacity="0.95" transform="translate(-48,6) scale(0.45)"/>

  <!-- Accent plant -->
  <g transform="translate(50,220)">
    <rect x="0" y="0" width="18" height="28" rx="4" fill="#D9A86F" />
    <circle cx="9" cy="-6" r="14" fill="#FFE6CC" />
  </g>

</svg>