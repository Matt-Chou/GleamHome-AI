<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Cozy living room in warm orange tones -->
  <defs>
    <linearGradient id="li_orange" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFF5EE"/>
      <stop offset="100%" stop-color="#FFF7F0"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#li_orange)" />

  <!-- Window -->
  <rect x="440" y="24" width="140" height="100" rx="8" fill="#FFEFD8" stroke="#FFD3A6" />
  <line x1="510" y1="24" x2="510" y2="124" stroke="#FFD3A6" stroke-width="2" />
  <line x1="440" y1="74" x2="580" y2="74" stroke="#FFD3A6" stroke-width="2" />

  <!-- Rug -->
  <ellipse cx="240" cy="260" rx="220" ry="60" fill="#FFF0E6" />

  <!-- Sofa -->
  <rect x="120" y="180" width="240" height="90" rx="20" fill="#FFDAB3" stroke="#FFC194" />
  <rect x="140" y="150" width="80" height="60" rx="12" fill="#FFEBD6" />
  <rect x="260" y="150" width="80" height="60" rx="12" fill="#FFEBD6" />

  <!-- Coffee table -->
  <rect x="300" y="210" width="100" height="40" rx="12" fill="#FFF4E6" stroke="#FFE0C2" />
  <circle cx="340" cy="230" r="6" fill="#FFE0C2" />

  <!-- Plant -->
  <g transform="translate(60,170)">
    <rect x="8" y="40" width="24" height="40" rx="6" fill="#F6CFA6" />
    <circle cx="20" cy="24" r="24" fill="#FFEAD8" />
  </g>
</svg>