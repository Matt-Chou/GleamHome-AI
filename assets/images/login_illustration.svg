<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Cozy living room illustration (simple, friendly shapes) -->
  <defs>
    <linearGradient id="li1" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFEFE0"/>
      <stop offset="100%" stop-color="#FFF2F7"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#li1)" />

  <!-- Window -->
  <rect x="440" y="24" width="140" height="100" rx="8" fill="#DDEBFF" stroke="#B6D0FF" />
  <line x1="510" y1="24" x2="510" y2="124" stroke="#B6D0FF" stroke-width="2" />
  <line x1="440" y1="74" x2="580" y2="74" stroke="#B6D0FF" stroke-width="2" />

  <!-- Rug -->
  <ellipse cx="240" cy="260" rx="220" ry="60" fill="#FCEFF7" />

  <!-- Sofa -->
  <rect x="120" y="180" width="240" height="90" rx="20" fill="#EAD8FF" stroke="#CFAEE6" />
  <rect x="140" y="150" width="80" height="60" rx="12" fill="#F6E9FF" />
  <rect x="260" y="150" width="80" height="60" rx="12" fill="#F6E9FF" />

  <!-- Coffee table -->
  <rect x="300" y="210" width="100" height="40" rx="12" fill="#FFF1E6" stroke="#FFD9B8" />
  <circle cx="340" cy="230" r="6" fill="#FFD9B8" />

  <!-- Plant -->
  <g transform="translate(60,170)">
    <rect x="8" y="40" width="24" height="40" rx="6" fill="#B7E5C0" />
    <circle cx="20" cy="24" r="24" fill="#DFF8DA" />
  </g>
</svg>